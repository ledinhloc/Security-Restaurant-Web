<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Restaurant Management</title>
    <!-- Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>

<body class="bg-gray-900 font-sans text-gray-200 antialiased">
<!-- Container -->
<div class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-4xl bg-white p-8 rounded-lg shadow-lg flex">
        <!-- Nửa trái chứa hình ảnh -->
        <div class="w-1/2">
            <img src="https://limody.vn/wp-content/uploads/2020/10/mon-ngon-quan-1-13.jpg?v=1603081882" alt="Restaurant Image"
                 class="w-full h-full object-cover rounded-lg shadow-md">
        </div>

        <!-- Nửa phải chứa form -->
        <div class="w-1/2 pl-8">
            <h2 class="text-3xl font-bold text-center text-blue-500 mb-6">Create Your Account</h2>

            <!-- Form đăng ký -->
            <form action="/register" method="post" id="registerForm">
                <!-- First Name -->
                <div class="mb-4">
                    <label for="firstName" class="block text-gray-700 font-semibold text-sm mb-2">First Name</label>
                    <input type="text" id="firstName" name="firstName" placeholder="Enter your first name"
                           class="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" required>
                </div>

                <!-- Last Name -->
                <div class="mb-4">
                    <label for="lastName" class="block text-gray-700 font-semibold text-sm mb-2">Last Name</label>
                    <input type="text" id="lastName" name="lastName" placeholder="Enter your last name"
                           class="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" required>
                </div>

                <!-- Email -->
                <div class="mb-4">
                    <label for="email" class="block text-gray-700 font-semibold text-sm mb-2">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email"
                           class="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" required>
                </div>

                <!-- Phone Number -->
                <div class="mb-4">
                    <label for="phone" class="block text-gray-700 font-semibold text-sm mb-2">Phone Number</label>
                    <input type="text" id="phone" name="phone" placeholder="Enter your phone number"
                           class="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" required>
                </div>

                <!-- Address -->
                <div class="mb-4">
                    <label for="address" class="block text-gray-700 font-semibold text-sm mb-2">Address</label>
                    <input type="text" id="address" name="address" placeholder="Enter your address"
                           class="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" required>
                </div>

                <!-- Date of Birth -->
                <div class="mb-4">
                    <label for="dateOfBirth" class="block text-gray-700 font-semibold text-sm mb-2">Date of Birth</label>
                    <input type="date" id="dateOfBirth" name="dateOfBirth"
                           class="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" required>
                </div>

                <!-- Password -->
                <div class="mb-6">
                    <label for="password" class="block text-gray-700 font-semibold text-sm mb-2">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password"
                           class="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" required>
                </div>

                <!-- Submit Button -->
                <div class="mb-4">
                    <button type="submit"
                            class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-300 transition duration-300">
                        Create Account
                    </button>
                </div>
            </form>

            <!-- Thông báo lỗi hoặc thành công -->
            <div class="mt-4" id="messageContainer">
                <p class="text-red-400 text-center" th:text="${error}"></p>
                <p class="text-green-400 text-center" th:text="${message}"></p>
            </div>
        </div>
    </div>
</div>

<!-- Validator.js -->
<script src="https://unpkg.com/validator@13.11.0/validator.min.js"
        integrity="sha384-1eSz2b0dDOl/qb8Wi1I15M8ULm6/ojjB4CJyI7pRMYUGci83GA8v7VFkZsUyky+R"
        crossorigin="anonymous"></script>

<!-- Custom Validation -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        document.getElementById("registerForm").addEventListener("submit", function (e) {
            e.preventDefault(); // Ngăn gửi mặc định

            // Lấy các giá trị từ form
            const firstName = document.getElementById("firstName").value.trim();
            const lastName = document.getElementById("lastName").value.trim();
            const email = document.getElementById("email").value.trim();
            const phone = document.getElementById("phone").value.trim();
            const address = document.getElementById("address").value.trim();
            const dateOfBirth = document.getElementById("dateOfBirth").value;
            const password = document.getElementById("password").value.trim();

            let errors = [];

            if (!firstName) {
                errors.push("First Name is required.");
            } else if (!validator.isAlpha(firstName.replace(/\s/g, ''))) {
                errors.push("First Name must contain only letters.");
            }

            if (!lastName) {
                errors.push("Last Name is required.");
            } else if (!validator.isAlpha(lastName.replace(/\s/g, ''))) {
                errors.push("Last Name must contain only letters.");
            }

            if (!validator.isEmail(email)) {
                errors.push("Invalid email format.");
            }

            if (!/^\d{9,12}$/.test(phone)) {
                errors.push("Phone number must be numeric and 9–12 digits.");
            }

            if (!address) {
                errors.push("Address is required.");
            } else if (!validator.isLength(address, { min: 5 })) {
                errors.push("Address must be at least 5 characters long.");
            }

            if (!dateOfBirth) {
                errors.push("Date of Birth is required.");
            } else {
                const dob = new Date(dateOfBirth);
                const today = new Date();
                const minAge = 18;
                const minDate = new Date(today.getFullYear() - minAge, today.getMonth(), today.getDate());
                if (dob > minDate) {
                    errors.push(`You must be at least ${minAge} years old.`);
                }
            }

            if (!validator.isLength(password, { min: 6 })) {
                errors.push("Password must be at least 6 characters.");
            }

            // Hiển thị lỗi
            const messageContainer = document.getElementById("messageContainer");

            // Xóa container lỗi cũ nếu có
            const oldErrorDiv = document.querySelector(".error-container");
            if (oldErrorDiv) oldErrorDiv.remove();

            if (errors.length > 0) {
                const errorDiv = document.createElement("div");
                errorDiv.className = "error-container text-red-400 text-sm mt-2";
                errorDiv.innerHTML = errors.map(error => `<p>${error}</p>`).join("");
                messageContainer.prepend(errorDiv);
            } else {
                this.submit();
            }
        });
    });
</script>

</body>
</html>
